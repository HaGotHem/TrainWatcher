<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d91">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Monatrain{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Monatrain</a>
    {% if user %}
      <span class="who">{{ user.username }}</span>
    {% else %}
      <a class="login" href="/login">Se connecter</a>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <nav class="tabbar" aria-label="Navigation">
    <a href="/" {% if tab == "accueil" %}class="active" aria-current="page"{% endif %}>Accueil</a>
    <a href="/trajet" {% if tab == "trajet" %}class="active" aria-current="page"{% endif %}>Trajet</a>
    <a href="/gare" {% if tab == "gare" %}class="active" aria-current="page"{% endif %}>Gare</a>
  </nav>
</body>
</html>
